# Keeps the built-in DopingControl (MIT) up to date from its author's GitHub.
#
# Chronicle's raid times can't be fetched from here: chronicleclassic.com sits
# behind Cloudflare, which challenges requests from GitHub's servers. They're
# fetched on a normal PC instead (tools\WhoDidIt-Sync.ps1) and ChronicleData.lua
# is updated from there.
name: Update DopingControl

on:
  schedule:
    - cron: "17 5 * * *"     # once a day
  workflow_dispatch:          # "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: embed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Update DopingControl
        shell: powershell
        run: |
          & .\tools\EmbedUpdate.ps1 -Only Doping

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A DopingControl WhoDidIt.toc
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "DopingControl update"
          git push
